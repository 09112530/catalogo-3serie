<!DOCTYPE html>
<html>
<head>
    <title>Catálogo</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Iago Teixeira">
    <link href="./style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Catálogo</h1>
    </header>
    <main>
        <section id="lista" class="lista"></section>
        <button id="btn-adicionar" class="btn-adicionar" title="Adicionar obra">+</button>
    </main>
    <footer>
        <p>&copy; Copyright - 2026 | Iago Teixeira</p>
    </footer>
    <dialog id="modal">
        <form id="form-obra" class="form-obra">
            <h2 id="modal-titulo">Nova obra</h2>
            <input type="hidden" id="campo-id" name="id">
            <label for="campo-nome">Nome</label>
            <input type="text" id="campo-nome" name="nome" maxlength="120" required>
            <div class="form-linha">
                <div>
                    <label for="campo-ano-inicio">Ano de início</label>
                    <input type="number" id="campo-ano-inicio" name="ano_inicio"
                    min="1900" max="2100" required>
                </div>
                <div>
                    <label for="campo-ano-fim">Ano de fim</label>
                    <input type="number" id="campo-ano-fim" name="ano_fim"
                    min="1900" max="2100" placeholder="vazio = em exibição">
                </div>
            </div>
            <label for="campo-categorias">Categorias</label>
            <input type="text" id="campo-categorias" name="categorias"
            maxlength="120" placeholder="Drama, Ação, Suspense" required>
            <label for="campo-descricao">Descrição</label>
            <textarea id="campo-descricao" name="descricao" rows="4" required></textarea>
            <label for="campo-imagem">Imagem (caminho ou URL)</label>
            <input type="text" id="campo-imagem" name="imagem"
            maxlength="255" placeholder="assets/images/nome.webp" required>
            <label for="campo-imagem-alt">Descrição da imagem (acessibilidade)</label>
            <input type="text" id="campo-imagem-alt" name="imagem_alt"
            maxlength="255" required>
            <div class="form-linha">
                <div>
                    <label for="campo-nota-imdb">Nota IMDb (0 a 10)</label>
                    <input type="number" id="campo-nota-imdb" name="nota_imdb"
                    min="0" max="10" step="0.1" required>
                </div>
                <div>
                    <label for="campo-nota-rotten">Rotten Tomatoes (%)</label>
                    <input type="number" id="campo-nota-rotten" name="nota_rotten"
                    min="0" max="100" step="1" required>
                </div>
            </div>
            <div class="form-botoes">
                <button type="button" id="btn-cancelar" class="btn-secundario">Cancelar</button>
                <button type="submit" class="btn-primario">Salvar</button>
            </div>
        </form>
    </dialog>
    <script src="./script.js"></script>
</body>
</html>
